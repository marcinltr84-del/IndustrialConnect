name: Build Industrial Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q IndustrialConnect_AndroidStudio.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Java and Kotlin versions
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$FILE"

          python3 - <<'PY'
          import os
          import re

          path = os.path.join(
              os.environ["PROJECT_DIR"],
              "app",
              "build.gradle.kts"
          )

          with open(path, encoding="utf-8") as f:
              content = f.read()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in content:
              pattern = r'(?m)^(\s*)android\s*\{\s*$'
              replacement = (
                  r'\1android {\n'
                  r'\1    compileOptions {\n'
                  r'\1        sourceCompatibility = JavaVersion.VERSION_17\n'
                  r'\1        targetCompatibility = JavaVersion.VERSION_17\n'
                  r'\1    }\n\n'
                  r'\1    kotlinOptions {\n'
                  r'\1        jvmTarget = "17"\n'
                  r'\1    }'
              )

              content, count = re.subn(
                  pattern, replacement, content, count=1
              )

              if count != 1:
                  raise SystemExit("Nie znaleziono bloku android { w pliku Gradle")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Ustawiono Java 17 i Kotlin 17.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: IndustrialConnect-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
